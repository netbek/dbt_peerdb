version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    target-branch: main
    commit-message:
      prefix: fix
      include: scope
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    target-branch: main
    commit-message:
      prefix: fix
      include: scope
    cooldown:
      default-days: 7

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
    target-branch: main
    commit-message:
      prefix: fix
      include: scope
    cooldown:
      default-days: 7

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
    target-branch: main
    commit-message:
      prefix: fix
      include: scope
    cooldown:
      default-days: 7
