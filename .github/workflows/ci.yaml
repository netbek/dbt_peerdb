name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --all-extras --dev

      - name: Cache pre-commit environment
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-python-${{ hashFiles('.python-version') }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: uv run --frozen pre-commit run ruff-check --hook-stage manual --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    needs: [pre-commit]
    permissions: {}
    env:
      TZ: Africa/Johannesburg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python dependencies
        run: uv sync --locked --all-extras --dev

      - name: Cache ClickHouse binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.clickhouse
          key: clickhouse-${{ runner.os }}-26.3.33.131

      - name: Install ClickHouse server
        run: uv run --frozen clickhousectl local install 26.3.33.131

      - name: Start ClickHouse server
        run: uv run --frozen clickhousectl local server start --version 26.3.33.131 --http-port 18123 --tcp-port 19000

      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 30); do
            uv run --frozen clickhousectl local client --port 19000 --query "SELECT version()" && break
            sleep 1
          done

      - name: Cache dbt packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fixtures/dbt/dbt_packages
          key: dbt-packages-${{ runner.os }}-${{ hashFiles('tests/fixtures/dbt/dependencies.yml') }}

      - name: Run dbt deps
        working-directory: tests/fixtures/dbt
        run: uv run --frozen dbt deps

      - name: Run Python tests
        run: uv run --frozen pytest

      - name: Stop ClickHouse server
        if: always()
        run: uv run --frozen clickhousectl local server stop || true
